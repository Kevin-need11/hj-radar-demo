  .searchbox{position:relative;}
  #q{width:100%;padding:13px 42px 13px 15px;font-size:16px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--text);outline:none;}

  .clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:none;border-radius:50%;background:var(--card2);color:var(--muted);font-size:16px;cursor:pointer;display:none;}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{white-space:nowrap;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:13px;cursor:pointer;}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .count{color:var(--muted);font-size:12px;padding:4px 14px 0;}
  main{padding:8px 12px 60px;display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));max-width:1150px;margin:0 auto;}
  .p{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;}
  .ptop{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;}
  .pname{font-size:17px;font-weight:700;}
  .pno{color:var(--muted);font-size:11px;background:var(--card2);padding:2px 7px;border-radius:7px;}
  .pgrp{color:var(--accent);font-size:11px;background:#16233b;padding:2px 7px;border-radius:7px;}
  .ptitle{color:var(--accent2);font-size:13.5px;margin:3px 0 1px;font-weight:600;}
  .pco{color:var(--muted);font-size:12.5px;}
  .sec{margin-top:9px;}
  .lbl{font-size:11px;color:var(--muted);margin-bottom:2px;}
  .offer{font-size:13.5px;}
  .ask{color:var(--ask);font-size:13.5px;}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;grid-column:1/-1;}
  .foot{grid-column:1/-1;text-align:center;color:#636975;font-size:11px;margin-top:8px;line-height:1.7;}
  mark{background:var(--accent);color:#fff;border-radius:3px;padding:0 2px;}
</style>
</head>

const list=document.getElementById('list'),q=document.getElementById('q'),clearBtn=document.getElementById('clear'),countEl=document.getElementById('count'),chipsEl=document.getElementById('chips');
let grp="";
const CHIPS=[["","全部"],["A","A 大繼承"],["B","B 都更"],["C","C 外商租賃"],["D","D 裝修工班"],["E","E 內容AI"],["H","H 健康保險"]];
function sx(p){return [p.no,p.n,p.t,p.c,p.o,p.a].join(" ").toLowerCase();}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function hl(s,ts){let o=esc(s);ts.filter(Boolean).forEach(t=>{o=o.replace(new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+")","gi"),"<mark>$1</mark>");});return o;}
function render(){
  const raw=q.value.trim().toLowerCase(),ts=raw.split(/\s+/).filter(Boolean);
  clearBtn.style.display=raw?"block":"none";
  let r=P.filter(p=>!grp||p.g===grp);
  if(ts.length)r=r.filter(p=>{const s=sx(p);return ts.every(t=>s.includes(t));});
  countEl.textContent=(grp?GROUPS[grp]+"・":"")+(raw?`找到 ${r.length} 位`:`共 ${r.length} 位`);
  if(!r.length){list.innerHTML=`<div class="empty">沒有符合「${esc(q.value.trim())}」的夥伴，換個詞試試</div>`;return;}
  list.innerHTML=r.map(p=>`<div class="p">
    <div class="ptop"><span class="pname">${hl(p.n,ts)}</span><span class="pno">NO.${p.no}</span><span class="pgrp">${p.g}組</span></div>
    <div class="ptitle">${hl(p.t,ts)}</div>${p.c?`<div class="pco">${hl(p.c,ts)}</div>`:``}
    ${p.o?`<div class="sec"><div class="lbl">能提供</div><div class="offer">${hl(p.o,ts)}</div></div>`:``}
    ${p.a?`<div class="sec"><div class="lbl">在找</div><div class="ask">${hl(p.a,ts)}</div></div>`:``}
  </div>`).join("")+`<div class="foot">資料整理自分會「依產業鏈分組」簡報，僅供會內引薦參考。<br>好厝 阿凱 整理</div>`;
}
chipsEl.innerHTML=CHIPS.map(([v,l])=>`<button class="chip${v===grp?' on':''}" data-g="${v}">${l}</button>`).join("");
chipsEl.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{grp=b.dataset.g;chipsEl.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.dataset.g===grp));render();});

q.addEventListener('input',render);render();
