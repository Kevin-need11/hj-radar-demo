<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好厝人脈雷達（範例）</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --card2:#222631; --line:#2b303b;
    --text:#e8eaed; --muted:#9aa0aa; --accent:#4f8cff; --accent2:#2dd4a7;
    --ask:#ffb454;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    line-height:1.55;}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#0f1115 70%,rgba(15,17,21,0));
    padding:18px 16px 10px;}
  h1{margin:0 0 2px;font-size:20px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:12px;}
  .searchbox{position:relative;}
  #q{width:100%;padding:14px 44px 14px 16px;font-size:17px;border-radius:14px;
    border:1px solid var(--line);background:var(--card);color:var(--text);outline:none;}
  #q:focus{border-color:var(--accent);}
  .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);
    width:28px;height:28px;border:none;border-radius:50%;background:var(--card2);
    color:var(--muted);font-size:16px;cursor:pointer;display:none;}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{white-space:nowrap;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);color:var(--text);font-size:14px;cursor:pointer;}
  .chip:active{background:var(--accent);border-color:var(--accent);}
  .count{color:var(--muted);font-size:13px;padding:4px 16px 0;}
  main{padding:8px 12px 60px;display:grid;gap:12px;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));max-width:1100px;margin:0 auto;}
  .person{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;}
  .ptop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .pname{font-size:18px;font-weight:700;}
  .pno{color:var(--muted);font-size:12px;background:var(--card2);padding:2px 8px;border-radius:8px;}
  .ptitle{color:var(--accent2);font-size:14px;margin:3px 0 2px;font-weight:600;}
  .pco{color:var(--muted);font-size:13px;}
  .sec{margin-top:11px;}
  .lbl{font-size:12px;color:var(--muted);margin-bottom:3px;}
  .offer li{margin:1px 0;}
  ul{margin:0;padding-left:18px;font-size:14px;}
  .ask{color:var(--ask);}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;}
  .tag{font-size:12px;color:var(--muted);background:var(--card2);padding:3px 9px;border-radius:7px;}
  .note{margin-top:11px;background:#15241f;border:1px solid #1f4036;border-radius:10px;
    padding:9px 11px;font-size:13px;color:#bfe8d8;}
  .note .nl{color:#5fd0a8;font-size:11px;display:block;margin-bottom:2px;}
  .contact{margin-top:10px;font-size:13px;color:var(--muted);}
  .contact b{color:var(--text);font-weight:600;}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;grid-column:1/-1;}
  .empty b{color:var(--text);}
  .foot{grid-column:1/-1;text-align:center;color:#636975;font-size:12px;margin-top:10px;}
  mark{background:var(--accent);color:#fff;border-radius:3px;padding:0 2px;}
</style>
</head>
<body>
<header>
  <h1>好厝人脈雷達 <span style="font-size:13px;color:var(--ask);font-weight:400;">範例</span></h1>
  <div class="sub">打一個詞（職業／需求），馬上找到章節裡誰能幫你。例：違建、水電、驗屋、律師</div>
  <div class="searchbox">
    <input id="q" type="text" placeholder="你需要什麼？輸入看看…" autocomplete="off">
    <button class="clear" id="clear">×</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
</header>
<main id="list"></main>

  offer:["房屋、土地、金融資產週轉融資","高資產客戶金融資產投資","美國證券分析師 CFA"],
  ask:"個人／公司融資或貸款需求、專業投資人（3000 萬以上淨值）",

// ===== 畫面 =====
const list=document.getElementById('list');
const q=document.getElementById('q');
const clearBtn=document.getElementById('clear');
const countEl=document.getElementById('count');
const chipsEl=document.getElementById('chips');
const EXAMPLES=["違建","建築師","水電","冷氣","除蟲","拆除","驗屋","律師","軟裝","都更","估價","智慧門鎖","照明","磁磚"];

function searchable(p){
  return [p.no,p.name,p.title,p.co,p.offer.join(" "),p.ask,p.tags.join(" ")].join(" ").toLowerCase();
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function hl(s,terms){
  let out=esc(s);
  terms.filter(t=>t).forEach(t=>{
    const re=new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+")","gi");
    out=out.replace(re,"<mark>$1</mark>");
  });
  return out;
}
function render(){
  const raw=q.value.trim().toLowerCase();
  const terms=raw.split(/\s+/).filter(Boolean);
  clearBtn.style.display=raw?"block":"none";
  let res=PEOPLE;
  if(terms.length){
    res=PEOPLE.filter(p=>{const s=searchable(p);return terms.every(t=>s.includes(t));});
  }
  countEl.textContent = raw ? `找到 ${res.length} 位` : `章節共 ${PEOPLE.length} 位（範例）`;
  if(!res.length){
    list.innerHTML=`<div class="empty"><b>目前章節沒有「${esc(q.value.trim())}」這個資源</b><br>
      正式版的阿凱會這樣回你，並建議：要不要我幫你去問章節有沒有人認識？或把這個需求記起來，有新夥伴進來就提醒你。</div>`;
    return;
  }
  list.innerHTML=res.map(p=>`
    <div class="person">
      <div class="ptop"><span class="pname">${hl(p.name,terms)}</span><span class="pno">NO.${p.no}</span></div>
      <div class="ptitle">${hl(p.title,terms)}</div>
      <div class="pco">${hl(p.co,terms)}</div>
      <div class="sec"><div class="lbl">他能提供（本週我有／專業）</div>
        <ul class="offer">${p.offer.map(o=>`<li>${hl(o,terms)}</li>`).join("")}</ul></div>
      <div class="sec"><div class="lbl">他在找（引薦需求）</div>
        <div class="ask">${hl(p.ask,terms)}</div></div>
      <div class="tags">${p.tags.map(t=>`<span class="tag">${hl(t,terms)}</span>`).join("")}</div>
      ${p.note?`<div class="note"><span class="nl">你的 121 筆記</span>${esc(p.note)}</div>`:``}
      <div class="contact">BNI 編號 <b>${p.no}</b> ｜ 電話 <b>（範例，正式版自動帶）</b></div>
    </div>`).join("")+`<div class="foot">這是範例，用章節簡報真實資料做的。正式版：你用「講的」記 121、電話自動帶、可跨好厝客戶資料一起查。</div>`;
}
chipsEl.innerHTML=EXAMPLES.map(e=>`<button class="chip">${e}</button>`).join("");
chipsEl.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{q.value=b.textContent;render();q.scrollIntoView({block:'start'});});
clearBtn.onclick=()=>{q.value="";render();q.focus();};
q.addEventListener('input',render);
render();
</script>
</body>
</html>
